<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Verification Dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --accent-blue: #0066cc;
            --status-dialing: #ffc107;
            --status-active: #28a745;
            --status-processing: #17a2b8;
            --status-complete: #28a745;
            --status-failed: #dc3545;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --bg-card: #2d2d2d;
                --text-primary: #f8f9fa;
                --text-secondary: #adb5bd;
                --border-color: #495057;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .button-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
        }

        .btn-retry {
            background: var(--status-failed);
            color: white;
        }

        .btn-retry:hover {
            opacity: 0.9;
        }

        .btn-done {
            background: var(--status-complete);
            color: white;
        }

        .btn-done:hover {
            opacity: 0.9;
        }

        .status-card {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .status-indicator {
            flex-shrink: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-top: 4px;
        }

        .status-indicator.pulsing {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dialing {
            background: var(--status-dialing);
        }

        .status-active {
            background: var(--status-active);
        }

        .status-processing {
            background: var(--status-processing);
        }

        .status-complete {
            background: var(--status-complete);
        }

        .status-failed {
            background: var(--status-failed);
        }

        .status-content {
            flex: 1;
        }

        .status-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .status-message {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .result-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .result-label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .result-value {
            margin-bottom: 16px;
            font-size: 15px;
        }

        .result-outcome {
            font-size: 18px;
            font-weight: 600;
            color: var(--status-complete);
            margin-bottom: 16px;
        }

        dl {
            margin: 0;
        }

        dt {
            font-weight: 500;
            margin-top: 8px;
            font-size: 14px;
        }

        dd {
            margin: 4px 0 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--status-active);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .htmx-indicator {
            display: inline-block;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📞 Insurance Verification</h1>
            <p>Fire and Forget Dashboard</p>
        </div>

        <div id="main-content">
            <div class="card">
                <form hx-post="/api/verify" hx-target="#main-content" hx-swap="innerHTML" x-data="{ prompt: '' }">
                    <div class="input-section">
                        <label for="prompt">Verification Request</label>
                        <textarea 
                            id="prompt" 
                            name="prompt" 
                            x-model="prompt"
                            placeholder="Call Metlife customer service to validate the following patient's insurance. Patient Name: 'John Doe', Patient Insurance Number: '123'"
                            required
                        ></textarea>
                    </div>
                    <div class="button-group">
                        <button 
                            type="button" 
                            class="btn-secondary"
                            @click="prompt = 'Call [insurance company] to verify coverage for [patient name], DOB [date], member ID [number]'"
                        >
                            📞 Quick Template
                        </button>
                        <button type="submit" class="btn-primary">
                            <span>Start Call</span>
                            <span class="htmx-indicator spinner"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
